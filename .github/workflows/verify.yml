name: verify

# PR 검증 게이트 — clean 환경에서 lockfile 정합성 + lint/typecheck/test/build 강제.
# 로컬 훅/turbo 캐시와 무관하게 결정론적으로 결함을 차단한다 (spec-14-01, #80 재발 방지).
# apps/api e2e 는 실제 Postgres 가 필요하므로 service container + 마이그레이션을 제공한다.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # 런타임 접속 = 비-슈퍼유저 app_runtime (RLS 테넌트 격리 적용 대상, spec-17-07).
      DATABASE_URL: postgres://app_runtime:test@localhost:5434/test
      # 마이그레이션/시드 = owner postgres (RLS 우회 필요).
      DATABASE_MIGRATE_URL: postgres://postgres:test@localhost:5434/test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # packageManager 필드(pnpm@11.1.2)를 자동 사용

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # turbo 로컬 캐시(.turbo/cache) 복원 — 변경 없는 태스크는 재실행 스킵(FULL TURBO).
      # 캐시는 속도 최적화일 뿐: 소스/lockfile 변경 시 turbo 해시가 자동 무효화한다.
      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # tooling/ 은 워크스페이스 패키지가 아니라 turbo run test 가 수집하지 않는다.
      # tooling 테스트(k8s 매니페스트 드리프트 등)를 별도 스텝으로 CI 에 편입.
      - name: Tooling tests (non-workspace)
        run: npx vitest run tooling

      # 죽은 코드(knip) + 레이어 경계(depcruise) 게이트. DB·build 불필요 →
      # 무거운 test 앞에서 구조 결함을 빠르게 차단 (spec-15-01, phase-14 성공기준5 보강).
      - name: Dead code + boundary gate (knip + depcruise)
        run: pnpm turbo run knip depcruise

      # 런타임 role 을 LOGIN+비밀번호로 사전 생성 — migrate 의 0012(CREATE ROLE IF NOT EXISTS)는
      # 이미 존재하므로 NOLOGIN 으로 덮지 않고 GRANT 만 적용한다. CI DB 는 매 실행 fresh.
      - name: Provision app_runtime role (login)
        run: psql "$DATABASE_MIGRATE_URL" -c "CREATE ROLE app_runtime LOGIN PASSWORD 'test'"

      - name: DB migrate (apps/api)
        run: pnpm --filter @apps/api db:migrate

      - name: Lint / Typecheck / Test / Build
        run: pnpm turbo run lint typecheck test build
