name: verify

# PR 검증 게이트 — clean 환경에서 lockfile 정합성 + lint/typecheck/test/build 강제.
# 로컬 훅/turbo 캐시와 무관하게 결정론적으로 결함을 차단한다 (spec-14-01, #80 재발 방지).
# apps/api e2e 는 실제 Postgres 가 필요하므로 service container + 마이그레이션을 제공한다.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # apps/api e2e('real PG') + drizzle migrate 용. 테스트 기본 DATABASE_URL 과 일치.
      DATABASE_URL: postgres://postgres:test@localhost:5434/test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # packageManager 필드(pnpm@11.1.2)를 자동 사용

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # 죽은 코드(knip) + 레이어 경계(depcruise) 게이트. DB·build 불필요 →
      # 무거운 test 앞에서 구조 결함을 빠르게 차단 (spec-15-01, phase-14 성공기준5 보강).
      - name: Dead code + boundary gate (knip + depcruise)
        run: pnpm turbo run knip depcruise

      - name: DB migrate (apps/api)
        run: pnpm --filter @apps/api db:migrate

      - name: Lint / Typecheck / Test / Build
        run: pnpm turbo run lint typecheck test build
