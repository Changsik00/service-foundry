name: e2e

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: service_foundry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 런타임 role 을 LOGIN+비밀번호로 사전 생성 (verify.yml 동일) — migrate 0012 는 GRANT 만 적용.
      - name: Provision app_runtime role (login)
        run: psql "postgresql://postgres:postgres@localhost:5432/service_foundry_test" -c "CREATE ROLE app_runtime LOGIN PASSWORD 'app_runtime'"

      - name: Run DB migrations
        env:
          # 마이그레이션 = owner/superuser (DDL·RLS 우회 + app_runtime GRANT 적용).
          DATABASE_MIGRATE_URL: postgresql://postgres:postgres@localhost:5432/service_foundry_test
        run: pnpm --filter @apps/api db:migrate

      # 브라우저 바이너리 캐시 — 버전은 playwright(lockfile)에 종속. 적중 시 다운로드 스킵.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter @apps/web exec playwright install --with-deps chromium

      - name: Run e2e tests
        env:
          NODE_ENV: test
          # Supabase
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # API — 런타임 = 비-슈퍼유저 app_runtime (RLS 테넌트 격리 적용, spec-17-07).
          API_BASE_URL: http://localhost:2026
          DATABASE_URL: postgresql://app_runtime:app_runtime@localhost:5432/service_foundry_test
        run: pnpm --filter @apps/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
