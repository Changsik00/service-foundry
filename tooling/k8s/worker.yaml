# apps/worker — redis(bull) 큐 consumer. HTTP 없음 → Service 없음.
# 이미지: 로컬 빌드 후 `kind load`. 운영은 ghcr.io/<org>/service-foundry-worker:<tag> 로 교체.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: service-foundry
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: service-foundry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: service-foundry
    spec:
      initContainers:
        - name: wait-for-redis
          image: redis:7-alpine
          command: ["sh", "-c", "until redis-cli -h redis ping; do echo waiting-redis; sleep 2; done"]
      containers:
        - name: worker
          image: service-foundry-worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
