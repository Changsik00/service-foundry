# postgres 16 — 샘플(emptyDir, 비영속). 운영은 StatefulSet + PVC + 백업 권장(README 참조).
# 최초 init 시 app_runtime role 생성 (tooling/docker/initdb 와 동일 로직, spec-17-07).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: service-foundry
  labels:
    app.kubernetes.io/part-of: service-foundry
data:
  01-app-runtime-role.sh: |
    #!/bin/sh
    # 비-슈퍼유저 런타임 role(app_runtime) 프로비저닝. 테이블 GRANT 는 db:migrate 0012 가 적용.
    set -e
    PW="${APP_RUNTIME_PASSWORD:-app_runtime_dev}"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_runtime') THEN CREATE ROLE app_runtime LOGIN PASSWORD '${PW}'; END IF; END \$\$;"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: service-foundry
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: service-foundry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: service-foundry
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: POSTGRES_PASSWORD
            - name: APP_RUNTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: APP_RUNTIME_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postgres -d $POSTGRES_DB"]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
        - name: initdb
          configMap:
            name: postgres-initdb
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: service-foundry
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: service-foundry
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
