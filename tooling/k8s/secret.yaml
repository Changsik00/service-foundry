# ⚠️ 샘플 시크릿 — 절대 운영에 그대로 쓰지 말 것.
#   운영: kubectl create secret / External Secrets Operator / SOPS / sealed-secrets 로 주입.
#   여기 값들은 로컬 kind 검증용 더미이며, production 가드(spec-16-02)를 통과하도록
#   dev 기본값("dev-secret-change-in-production")이 아닌 임의 강한 문자열을 쓴다.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: service-foundry
  labels:
    app.kubernetes.io/part-of: service-foundry
type: Opaque
stringData:
  # postgres 슈퍼유저 — 마이그레이션 Job 전용.
  POSTGRES_PASSWORD: "local-superuser-pw"
  # 비-슈퍼유저 런타임 role(app_runtime) 비밀번호 — RLS 격리 주체(spec-17-07).
  APP_RUNTIME_PASSWORD: "local-runtime-pw"
  # 런타임 접속: app_runtime role (RLS 적용). 슈퍼유저(postgres)면 production 가드가 기동 거부.
  DATABASE_URL: "postgresql://app_runtime:local-runtime-pw@postgres:5432/service_foundry"
  # 마이그레이션 접속: 슈퍼유저(owner) — drizzle 0012 가 app_runtime 에 GRANT 적용.
  DATABASE_MIGRATE_URL: "postgresql://postgres:local-superuser-pw@postgres:5432/service_foundry"
  # production 가드 통과용 강한 시크릿 (운영은 32바이트+ 랜덤으로 교체).
  CSRF_SECRET: "local-csrf-secret-please-rotate-32b"
  OAUTH_STATE_SECRET: "local-oauth-state-secret-please-rot"
  # production 가드: RESEND_API_KEY 비어있으면 기동 거부 — 더미 키.
  RESEND_API_KEY: "re_local_dummy_key"
