# apps/api — NestJS HTTP 서버.
# 이미지: 로컬 빌드 후 `kind load`(verify.sh). 운영은 ghcr.io/<org>/service-foundry-api:<tag> 로 교체.
# 포트 2026 은 apps/api/service.yaml(SoT) 와 일치 — manifest-drift 테스트가 강제.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: service-foundry
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: service-foundry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: service-foundry
    spec:
      initContainers:
        # postgres 가 연결을 받을 때까지 대기 (app_runtime role 은 initdb 가 생성).
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            ["sh", "-c", "until pg_isready -h postgres -U postgres; do echo waiting-postgres; sleep 2; done"]
      containers:
        - name: api
          image: service-foundry-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2026
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          livenessProbe:
            httpGet:
              path: /health/live
              port: 2026
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 2026
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: service-foundry
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: service-foundry
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 2026
      targetPort: 2026
